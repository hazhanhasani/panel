services:
  bluepanel:
    build:
      context: ./source
      dockerfile: Dockerfile
    image: bluepanel:local
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - /var/lib/bluepanel:/var/lib/bluepanel
    healthcheck:
      test: ["CMD", "/code/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    stop_grace_period: 30s
