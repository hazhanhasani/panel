name: BluePanel Four-Repo Quality Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contract:
    name: Component contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel
        uses: actions/checkout@v7

      - name: Checkout BluePanel Node
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node
          ref: main
          path: _components/node

      - name: Checkout Go bridge
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node_bridge
          ref: main
          path: _components/node_bridge

      - name: Checkout Python bridge
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node_bridge_py
          ref: main
          path: _components/node_bridge_py

      - name: Validate four-component contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path('.')
          manifest = json.loads((root / 'BLUEPANEL_COMPONENTS.json').read_text())
          expected = {
              'panel': 'hazhanhasani/panel',
              'node': 'hazhanhasani/node',
              'go_bridge': 'hazhanhasani/node_bridge',
              'python_bridge': 'hazhanhasani/node_bridge_py',
          }
          for key, repo in expected.items():
              actual = manifest['components'][key]['repository']
              if actual != repo:
                  raise SystemExit(f'{key}: expected {repo}, got {actual}')

          def normalize_proto(path):
              text = pathlib.Path(path).read_text(encoding='utf-8')
              text = re.sub(r'//.*', '', text)
              text = re.sub(r'option\s+go_package\s*=\s*"[^"]+"\s*;', '', text)
              return re.sub(r'\s+', '', text)

          canonical = normalize_proto('_components/node/common/service.proto')
          go_bridge = normalize_proto('_components/node_bridge/common/service.proto')
          py_bridge = normalize_proto('_components/node_bridge_py/PasarGuardNodeBridge/common/service.proto')
          if canonical != go_bridge:
              raise SystemExit('Go bridge service.proto is out of sync with BluePanel Node')
          if canonical != py_bridge:
              raise SystemExit('Python bridge service.proto is out of sync with BluePanel Node')

          panel = tomllib.loads((root / 'pyproject.toml').read_text())
          deps = panel['project']['dependencies']
          bridge_dep = next((d for d in deps if d.startswith('bluepanel-node-bridge ')), None)
          if not bridge_dep or 'github.com/hazhanhasani/node_bridge_py.git@' not in bridge_dep:
              raise SystemExit('Panel is not pinned to hazhanhasani/node_bridge_py')

          revision = manifest['components']['python_bridge']['revision']
          if f'@{revision}' not in bridge_dep:
              raise SystemExit('BLUEPANEL_COMPONENTS python bridge revision does not match panel dependency pin')

          bridge_head = subprocess.check_output(
              ['git', '-C', '_components/node_bridge_py', 'rev-parse', 'HEAD'], text=True
          ).strip()
          if revision != bridge_head:
              raise SystemExit(
                  f'Panel pins Python bridge {revision}, but current bridge main is {bridge_head}'
              )

          go_mod = pathlib.Path('_components/node_bridge/go.mod').read_text()
          if 'module github.com/hazhanhasani/node_bridge' not in go_mod:
              raise SystemExit('Go bridge module does not point to hazhanhasani/node_bridge')

          pyproject = tomllib.loads(pathlib.Path('_components/node_bridge_py/pyproject.toml').read_text())
          if pyproject['project']['name'] != 'bluepanel-node-bridge':
              raise SystemExit('Python bridge package name mismatch')
          if not pathlib.Path('_components/node_bridge_py/BluePanelNodeBridge/__init__.py').exists():
              raise SystemExit('BluePanelNodeBridge public namespace is missing')

          release_hook = pathlib.Path('dashboard/src/hooks/use-node-releases.ts').read_text()
          if 'repos/hazhanhasani/node/releases/latest' not in release_hook:
              raise SystemExit('Panel release hook is not using hazhanhasani/node')

          print('All four BluePanel repositories are contract-compatible')
          PY

  panel-backend:
    name: Panel backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check . --no-fix

      - name: Pytest
        run: uv run pytest -q

  panel-frontend:
    name: Panel frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout panel
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: VITE_BASE_API=/ bun run build

  node:
    name: BluePanel Node build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BluePanel Node
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Verify module is tidy
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generate test certificates
        run: |
          make generate_server_cert
          make generate_client_cert

      - name: Install Xray for node tests
        run: make install_xray

      - name: Vet packages
        run: go vet ./...

      - name: Run unit tests
        run: TEST_INTEGRATION=false go test ./... -count=1 -p 1

      - name: Build node binary
        run: CGO_ENABLED=0 go build ./cmd/node

  go-bridge:
    name: Go bridge build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Go bridge
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node_bridge
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Verify module is tidy
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet packages
        run: go vet ./...

      - name: Build packages
        run: go build ./...

      - name: Run tests
        env:
          BLUEPANEL_NODE_E2E: '0'
        run: go test ./... -count=1

  python-bridge:
    name: Python bridge build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python bridge
        uses: actions/checkout@v7
        with:
          repository: hazhanhasani/node_bridge_py
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check . --no-fix

      - name: Pytest
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Verify public import
        run: uv run python -c "from BluePanelNodeBridge import BluePanelNode, Health, NodeType, create_node; from BluePanelNodeBridge.common.service_pb2 import User; print('BluePanel bridge import OK')"
