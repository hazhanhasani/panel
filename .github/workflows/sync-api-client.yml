name: Sync BluePanel API Client

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dashboard/src/service/api/index.ts'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Export OpenAPI and regenerate client
        run: uv run python scripts/export_openapi.py /tmp/bluepanel-openapi.json --gen-client

      - name: Validate generated API client
        working-directory: dashboard
        run: |
          bunx tsc -b --pretty false
          VITE_BASE_API=/ bun run build

      - name: Commit generated client when changed
        run: |
          if git diff --quiet -- dashboard/src/service/api/index.ts; then
            echo "API client already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/service/api/index.ts
          git commit -m "chore: regenerate BluePanel API client"
          git pull --rebase origin main
          git push origin main